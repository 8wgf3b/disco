[workspace]
members = [
    # "crates/future_binary", # Uncomment or add new ones here later!
]
resolver = "2"

[package]
name = "disco"
version = "0.3.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.104"
dotenvy = "0.15.7"
tokio = { version = "1.53.3"}
serenity = "0.12"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
console-subscriber = "0.5"
thiserror = "2.0.21"

[dependencies]
anyhow.workspace = true
dotenvy.workspace = true
tokio = {workspace = true, features = ["macros", "rt-multi-thread" , "tracing"]}
serenity = {workspace = true, features = ["client", "gateway", "model", "rustls_backend"]}
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber = {workspace = true, features = ["env-filter", "fmt", "json"]}
console-subscriber.workspace = true
thiserror.workspace = true

[profile.release]
strip = true

[build]
rustflags = ["--cfg", "tokio_unstable"]
